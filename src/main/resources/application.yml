server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/LibraryMS}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 30000
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
